<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14171a">
<title>HAZREP</title>
<style>
  :root {
    --panel: #14171a;
    --panel-raised: #1c2024;
    --ink: #eef0ef;
    --ink-dim: #8b9199;
    --caution: #d99a3d;
    --rule: #2a2f34;
    --radius: 2px;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--panel);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 32px 20px 48px; }
  header { margin-bottom: 8px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-dim); margin: 0 0 14px;
  }
  .stamp { font-size: 15px; letter-spacing: 0.02em; color: var(--caution); margin: 0 0 20px; }
  h1 { font-size: 21px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
  .desc { font-size: 13px; color: var(--ink-dim); line-height: 1.55; margin: 0 0 28px; }
  .logline { border-top: 1px solid var(--rule); padding: 18px 0; }
  .logline:last-of-type { border-bottom: 1px solid var(--rule); }
  .logline label, .confidential label {
    display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-dim); margin-bottom: 10px;
  }
  input[type="text"], textarea {
    width: 100%; padding: 11px 12px; font-size: 16px; font-family: inherit;
    border: 1px solid var(--rule); border-radius: var(--radius);
    background: var(--panel-raised); color: var(--ink);
  }
  input::placeholder, textarea::placeholder { color: #565c62; }
  input:focus, textarea:focus {
    outline: none; border-color: var(--ink-dim); box-shadow: 0 0 0 1px var(--ink-dim);
  }
  textarea { resize: none; overflow-y: hidden; min-height: 110px; line-height: 1.5; }
  .segmented { display: flex; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
  .segmented button {
    flex: 1; padding: 11px 6px; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
    font-family: inherit; background: var(--panel-raised); border: none; border-right: 1px solid var(--rule);
    color: var(--ink-dim); cursor: pointer;
  }
  .segmented button:last-child { border-right: none; }
  .segmented button.active { background: var(--ink); color: var(--panel); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .toggle-row span { font-size: 14px; color: var(--ink); }
  .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--rule); border-radius: 999px; transition: 0.15s; cursor: pointer; }
  .slider::before {
    content: ""; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px;
    background: var(--ink-dim); border-radius: 50%; transition: 0.15s;
  }
  input:checked + .slider { background: rgba(217,154,61,0.25); }
  input:checked + .slider::before { transform: translateX(18px); background: var(--caution); }
  .confidential { margin-top: 4px; padding: 16px 0 4px; }
  .confidential .tag {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 16px;
  }
  .confidential .field { margin-bottom: 16px; }
  .actions { margin-top: 28px; }
  button.primary, button.secondary {
    width: 100%; padding: 15px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
    font-family: inherit; border-radius: var(--radius); cursor: pointer; border: none;
  }
  button.primary { background: var(--ink); color: var(--panel); margin-bottom: 10px; }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
  button.primary:active, button.secondary:active { opacity: 0.8; }
  .error { font-size: 12px; color: var(--caution); margin-top: 8px; display: none; }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Confidential · Safety Office</p>
    <p class="stamp mono" id="dtg">—</p>
    <h1>Hazard Report</h1>
    <p class="desc">Under a minute to file. Your name and contact are seen only by the Safety Office and never appear in summaries.</p>
  </header>

  <div class="logline">
    <label>Hazard Category</label>
    <div class="segmented" id="typeSegment">
      <button type="button" class="active" data-value="Flying">Flying</button>
      <button type="button" data-value="Non-Flying">Non-Flying</button>
    </div>
  </div>

  <div class="logline">
    <div class="toggle-row">
      <span>OHS related</span>
      <label class="switch">
        <input type="checkbox" id="ohs">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="logline">
    <label for="eventDescription">Event Description</label>
    <textarea id="eventDescription" placeholder="Who, what, when, where, how — describe the hazard in full"></textarea>
    <div class="error" id="eventError">This field is required.</div>
  </div>

  <div class="logline">
    <label for="remedy">Suggested remedy</label>
    <textarea id="remedy" placeholder="Optional — how would you fix it"></textarea>
  </div>

  <div class="confidential">
    <p class="tag">Confidential — follow-up only</p>
    <div class="field">
      <label for="rank">Rank</label>
      <input type="text" id="rank" placeholder="Optional">
    </div>
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Optional, but helps us follow up">
    </div>
    <div class="field">
      <label for="tel">Tel no</label>
      <input type="text" id="tel" placeholder="Optional">
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="sendBtn">Send as Email</button>
    <button class="secondary" id="copyBtn">Copy Report Text</button>
  </div>
</div>

<script>
  const SAFETY_OFFICE_EMAIL = "Cfs@telkomsa.net";

  const typeSegment = document.getElementById('typeSegment');
  let hazardCategory = 'Flying';
  typeSegment.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    typeSegment.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    hazardCategory = btn.dataset.value;
  });

  const dtgEl = document.getElementById('dtg');
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function pad(n) { return String(n).padStart(2, '0'); }
  function formatDTG(d) {
    const bravo = new Date(d.getTime() + 2 * 60 * 60000);
    const day = pad(bravo.getUTCDate());
    const hour = pad(bravo.getUTCHours());
    const min = pad(bravo.getUTCMinutes());
    const mon = MONTHS[bravo.getUTCMonth()];
    const yr = pad(bravo.getUTCFullYear() % 100);
    return `${day}${hour}${min}B ${mon} ${yr}`;
  }
  function tickDTG() { dtgEl.textContent = formatDTG(new Date()); }
  tickDTG();
  setInterval(tickDTG, 1000);

  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }
  document.querySelectorAll('textarea').forEach(el => {
    autoGrow(el);
    el.addEventListener('input', () => autoGrow(el));
  });

  function buildReportText() {
    const ohs = document.getElementById('ohs').checked;
    const eventDescription = document.getElementById('eventDescription').value.trim();
    const remedy = document.getElementById('remedy').value.trim();
    const rank = document.getElementById('rank').value.trim();
    const name = document.getElementById('name').value.trim();
    const tel = document.getElementById('tel').value.trim();

    let lines = [];
    lines.push(`DTG: ${dtgEl.textContent}`);
    lines.push(`Hazard Category: ${hazardCategory}${ohs ? ' (OHS related)' : ''}`);
    lines.push('');
    lines.push('Event Description (Who, What, When, Where, How):');
    lines.push(eventDescription || '\u2014');
    if (remedy) {
      lines.push('');
      lines.push(`Suggested Remedy: ${remedy}`);
    }
    lines.push('');
    lines.push('\u2014 Confidential \u2014');
    lines.push(`Rank: ${rank || 'not provided'}`);
    lines.push(`Name: ${name || 'not provided'}`);
    lines.push(`Tel No: ${tel || 'not provided'}`);
    return lines.join('\n');
  }

  function validate() {
    const val = document.getElementById('eventDescription').value.trim();
    const errorEl = document.getElementById('eventError');
    if (!val) {
      errorEl.classList.add('show');
      document.getElementById('eventDescription').focus();
      return false;
    }
    errorEl.classList.remove('show');
    return true;
  }

  document.getElementById('sendBtn').addEventListener('click', () => {
    if (!validate()) return;
    const text = buildReportText();
    const subject = encodeURIComponent(`HAZREP ${dtgEl.textContent} \u2014 ${hazardCategory}`);
    const body = encodeURIComponent(text);
    window.location.href = `mailto:${SAFETY_OFFICE_EMAIL}?subject=${subject}&body=${body}`;
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    if (!validate()) return;
    const text = buildReportText();
    const btn = document.getElementById('copyBtn');
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = 'Copied \u2713';
    } catch (err) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); btn.textContent = 'Copied \u2713'; }
      catch (e) { btn.textContent = 'Copy failed'; }
      document.body.removeChild(ta);
    }
    setTimeout(() => { btn.textContent = 'Copy Report Text'; }, 2500);
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
