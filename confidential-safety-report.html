<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14171a">
<title>Mishap Report</title>
<style>
  :root {
    --panel: #14171a; --panel-raised: #1c2024; --ink: #eef0ef; --ink-dim: #8b9199;
    --caution: #d99a3d; --rule: #2a2f34; --radius: 2px;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  html, body {
    margin: 0; padding: 0; background: var(--panel); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 32px 20px 48px; }
  header { margin-bottom: 8px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); margin: 0 0 14px; }
  .stamp { font-size: 15px; letter-spacing: 0.02em; color: var(--caution); margin: 0 0 20px; }
  h1 { font-size: 21px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
  .desc { font-size: 13px; color: var(--ink-dim); line-height: 1.55; margin: 0 0 28px; }
  .logline { border-top: 1px solid var(--rule); padding: 18px 0; }
  .logline:last-of-type { border-bottom: 1px solid var(--rule); }
  .logline label, .confidential label {
    display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-dim); margin-bottom: 10px;
  }
  input[type="text"], input[type="datetime-local"], textarea, select {
    width: 100%; padding: 11px 12px; font-size: 16px; font-family: inherit;
    border: 1px solid var(--rule); border-radius: var(--radius);
    background: var(--panel-raised); color: var(--ink);
  }
  input::placeholder, textarea::placeholder { color: #565c62; }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--ink-dim); box-shadow: 0 0 0 1px var(--ink-dim);
  }
  textarea { resize: none; overflow-y: hidden; min-height: 64px; line-height: 1.5; }
  select {
    padding-right: 34px; appearance: none; -webkit-appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%238b9199"/></svg>');
    background-repeat: no-repeat; background-position: right 12px center; font-size: 15px;
  }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .segmented { display: flex; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
  .segmented button {
    flex: 1; padding: 11px 6px; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
    font-family: inherit; background: var(--panel-raised); border: none; border-right: 1px solid var(--rule);
    color: var(--ink-dim); cursor: pointer;
  }
  .segmented button:last-child { border-right: none; }
  .segmented button.active { background: var(--ink); color: var(--panel); }
  .subgroup { margin-top: 16px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .toggle-row span { font-size: 14px; color: var(--ink); }
  .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--rule); border-radius: 999px; transition: 0.15s; cursor: pointer; }
  .slider::before {
    content: ""; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px;
    background: var(--ink-dim); border-radius: 50%; transition: 0.15s;
  }
  input:checked + .slider { background: rgba(217,154,61,0.25); }
  input:checked + .slider::before { transform: translateX(18px); background: var(--caution); }
  .ghost {
    width: 100%; padding: 10px 12px; font-size: 13px; font-family: inherit;
    background: transparent; color: var(--ink-dim); border: 1px dashed var(--rule); border-radius: var(--radius);
    cursor: pointer; margin-top: 10px;
  }
  .crewgroup { border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .crewgroup .crewtitle { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--caution); margin-bottom: 12px; }
  .crewgroup input { margin-bottom: 10px; }
  .crewgroup input:last-child { margin-bottom: 0; }
  .actions { margin-top: 28px; }
  button.primary, button.secondary {
    width: 100%; padding: 15px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
    font-family: inherit; border-radius: var(--radius); cursor: pointer; border: none;
  }
  button.primary { background: var(--ink); color: var(--panel); margin-bottom: 10px; }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
  button.primary:active, button.secondary:active { opacity: 0.8; }
  .confidential { margin-top: 4px; padding: 16px 0 4px; }
  .confidential .tag { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 16px; }
  .confidential .field { margin-bottom: 16px; }
  .error { font-size: 12px; color: var(--caution); margin-top: 8px; display: none; }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Confidential · Safety Office</p>
    <p class="stamp mono" id="dtg">—</p>
    <h1>Mishap Report</h1>
    <p class="desc">Base AFB LBWG · Unit CFS · Aircraft PC 7 MK II. Under two minutes — the rest is completed by BASCO.</p>
  </header>

  <div class="logline">
    <label>3A. Type</label>
    <div class="segmented" id="typeSegment">
      <button type="button" class="active" data-value="Incident">Incident</button>
      <button type="button" data-value="Accident">Accident</button>
    </div>
  </div>

  <div class="logline">
    <label>3B. Category</label>
    <div class="segmented" id="categorySegment">
      <button type="button" class="active" data-value="Flying">Flying</button>
      <button type="button" data-value="Non-Flying">Non-Flying</button>
    </div>
  </div>

  <div class="logline">
    <label for="division">3C. Mishap Division</label>
    <select id="division">
      <option value="Normal" selected>Normal</option>
      <option value="ATC">ATC</option>
      <option value="Bird">Bird</option>
      <option value="Weapon">Weapon</option>
      <option value="Battle">Battle</option>
    </select>
  </div>

  <div class="logline">
    <label for="tail">4B. Tail Number</label>
    <input type="text" id="tail" placeholder="e.g. 2027">
  </div>

  <div class="logline">
    <label for="occurred">5A/B. Date &amp; Time of Occurrence</label>
    <input type="datetime-local" id="occurred">
    <div class="subgroup">
      <label for="timeOfDay" style="margin-bottom:8px;">5C. Time of Day</label>
      <select id="timeOfDay">
        <option value="Day" selected>Day</option>
        <option value="Night">Night</option>
        <option value="Sunrise">Sunrise</option>
        <option value="Sunset">Sunset</option>
        <option value="N/A">N/A</option>
      </select>
    </div>
  </div>

  <div class="logline">
    <label for="latlong">6A. UTM / Coordinates</label>
    <input type="text" id="latlong" placeholder="Tap button to auto-fill, or type manually">
    <button type="button" class="ghost" id="locBtn">Use My Location</button>
  </div>

  <div class="logline" id="flyingSection">
    <label>7. Sortie Details</label>
    <input type="text" id="sortieType" placeholder="7A. Sortie type" style="margin-bottom:12px;">
    <select id="phase" style="margin-bottom:12px;">
      <option value="" selected disabled>7B. Phase of flight</option>
      <option value="Servicing">Servicing</option>
      <option value="Parked">Parked</option>
      <option value="Towing">Towing</option>
      <option value="Start">Start</option>
      <option value="Taxi">Taxi</option>
      <option value="Stationary">Stationary</option>
      <option value="Take Off">Take Off</option>
      <option value="Climb">Climb</option>
      <option value="Cruise">Cruise</option>
      <option value="Attack">Attack</option>
      <option value="Hover">Hover</option>
      <option value="Descent">Descent</option>
      <option value="Approach">Approach</option>
      <option value="Landing">Landing</option>
      <option value="Other">Other</option>
    </select>
    <input type="text" id="speed" placeholder="7C. Speed (KCAS)" style="margin-bottom:12px;">
    <input type="text" id="height" placeholder="7D. Height (ft AGL)" style="margin-bottom:12px;">
    <select id="rules" style="margin-bottom:12px;">
      <option value="VFR" selected>7E. VFR</option>
      <option value="IFR">IFR</option>
      <option value="S/VFR">S/VFR</option>
      <option value="N/A">N/A</option>
    </select>
    <select id="met">
      <option value="VMC" selected>7F. VMC</option>
      <option value="IMC">IMC</option>
      <option value="N/A">N/A</option>
    </select>
  </div>

  <div class="logline">
    <label for="eventDescription">9. Event Description</label>
    <textarea id="eventDescription" placeholder="What happened"></textarea>
    <div class="error" id="eventError">This field is required.</div>
  </div>

  <div class="logline">
    <label for="actionsTaken">10. Actions Taken</label>
    <textarea id="actionsTaken" placeholder="Optional"></textarea>
  </div>

  <div class="confidential">
    <p class="tag">11. Crew &amp; Contact — Confidential</p>
    <div class="crewgroup">
      <p class="crewtitle">A. Commander</p>
      <input type="text" id="forceNoA" placeholder="Force No">
      <input type="text" id="rankA" placeholder="Rank">
      <input type="text" id="initA" placeholder="Initials">
      <input type="text" id="surnameA" placeholder="Surname">
    </div>
    <div class="crewgroup">
      <p class="crewtitle">B. Co-pilot / Student</p>
      <input type="text" id="forceNoB" placeholder="Force No">
      <input type="text" id="rankB" placeholder="Rank">
      <input type="text" id="initB" placeholder="Initials">
      <input type="text" id="surnameB" placeholder="Surname">
    </div>
    <div class="field">
      <label for="tel">Tel No</label>
      <input type="text" id="tel" placeholder="Optional">
    </div>
    <div class="toggle-row" style="margin-top:4px;">
      <span>Any injuries</span>
      <label class="switch">
        <input type="checkbox" id="injuries">
        <span class="slider"></span>
      </label>
    </div>
    <textarea id="injuryDetail" placeholder="Brief description" style="margin-top:12px; display:none;"></textarea>
  </div>

  <div class="actions">
    <button class="primary" id="sendBtn">Send as Email</button>
    <button class="secondary" id="copyBtn" style="margin-bottom:10px;">Copy Report Text</button>
    <button class="secondary" id="downloadBtn">Download CSV</button>
  </div>
</div>

<script>
  const SAFETY_OFFICE_EMAIL = "Cfs@telkomsa.net";

  function makeSegment(id, initial, onChange) {
    const el = document.getElementById(id);
    let value = initial;
    el.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      el.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      value = btn.dataset.value;
      if (onChange) onChange(value);
    });
    return { get: () => value };
  }

  const typeSeg = makeSegment('typeSegment', 'Incident');
  const categorySeg = makeSegment('categorySegment', 'Flying', updateConditionals);
  const divisionEl = document.getElementById('division');
  divisionEl.addEventListener('change', updateConditionals);

  function updateConditionals() {
    document.getElementById('flyingSection').style.display = (categorySeg.get() === 'Flying') ? '' : 'none';
  }
  updateConditionals();

  document.getElementById('injuries').addEventListener('change', (e) => {
    document.getElementById('injuryDetail').style.display = e.target.checked ? '' : 'none';
  });

  document.getElementById('locBtn').addEventListener('click', () => {
    const btn = document.getElementById('locBtn');
    if (!navigator.geolocation) { btn.textContent = 'Not available on this device'; return; }
    btn.textContent = 'Getting location…';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        document.getElementById('latlong').value = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
        btn.textContent = 'Use My Location';
      },
      () => { btn.textContent = 'Unavailable — enter manually'; },
      { timeout: 8000 }
    );
  });

  const dtgEl = document.getElementById('dtg');
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function pad(n) { return String(n).padStart(2, '0'); }
  function bravoDate(d) { return new Date(d.getTime() + 2 * 60 * 60000); }
  function formatDTG(d) {
    const b = bravoDate(d);
    return `${pad(b.getUTCDate())}${pad(b.getUTCHours())}${pad(b.getUTCMinutes())}B ${MONTHS[b.getUTCMonth()]} ${pad(b.getUTCFullYear() % 100)}`;
  }
  function finYear(d) {
    const b = bravoDate(d);
    const y = b.getUTCFullYear(), m = b.getUTCMonth() + 1;
    const start = (m >= 4) ? y : y - 1;
    return `${String(start).slice(2)}/${String(start + 1).slice(2)}`;
  }
  function tickDTG() { dtgEl.textContent = formatDTG(new Date()); }
  tickDTG();
  setInterval(tickDTG, 1000);

  const occurredEl = document.getElementById('occurred');
  (function setDefaultOccurred() {
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    occurredEl.value = now.toISOString().slice(0, 16);
  })();
  function ddmmyyyy() {
    if (!occurredEl.value) return '';
    const [datePart] = occurredEl.value.split('T');
    const [y, m, d] = datePart.split('-');
    return `${d}/${m}/${y}`;
  }
  function timeOnly() {
    if (!occurredEl.value) return '';
    const parts = occurredEl.value.split('T');
    return parts[1] || '';
  }

  function autoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
  document.querySelectorAll('textarea').forEach(el => {
    autoGrow(el);
    el.addEventListener('input', () => autoGrow(el));
  });

  function collectFields() {
    return {
      tail: document.getElementById('tail').value.trim(),
      timeOfDay: document.getElementById('timeOfDay').value,
      coordinates: document.getElementById('latlong').value.trim(),
      sortieType: document.getElementById('sortieType').value.trim(),
      phase: document.getElementById('phase').value,
      speed: document.getElementById('speed').value.trim(),
      height: document.getElementById('height').value.trim(),
      rules: document.getElementById('rules').value,
      met: document.getElementById('met').value,
      eventDescription: document.getElementById('eventDescription').value.trim(),
      actionsTaken: document.getElementById('actionsTaken').value.trim(),
      forceNoA: document.getElementById('forceNoA').value.trim(),
      rankA: document.getElementById('rankA').value.trim(),
      initA: document.getElementById('initA').value.trim(),
      surnameA: document.getElementById('surnameA').value.trim(),
      forceNoB: document.getElementById('forceNoB').value.trim(),
      rankB: document.getElementById('rankB').value.trim(),
      initB: document.getElementById('initB').value.trim(),
      surnameB: document.getElementById('surnameB').value.trim(),
      tel: document.getElementById('tel').value.trim(),
      injuries: document.getElementById('injuries').checked,
      injuryDetail: document.getElementById('injuryDetail').value.trim()
    };
  }

  function buildReportText() {
    const f = collectFields();
    let lines = [];
    lines.push(`Filed (DTG): ${dtgEl.textContent}`);
    lines.push(`Fin Year: ${finYear(new Date())}`);
    lines.push(`3A. Type: ${typeSeg.get()}`);
    lines.push(`3B. Category: ${categorySeg.get()}`);
    lines.push(`3C. Division: ${divisionEl.value}`);
    lines.push(`4B. Tail: ${f.tail || '\u2014'}`);
    lines.push(`5. Date: ${ddmmyyyy()}  Time: ${timeOnly()}  (${f.timeOfDay})`);
    lines.push(`6A. Coordinates: ${f.coordinates || '\u2014'}`);
    if (categorySeg.get() === 'Flying') {
      lines.push('7. Sortie Details:');
      if (f.sortieType) lines.push(`  Sortie Type: ${f.sortieType}`);
      if (f.phase) lines.push(`  Phase of Flight: ${f.phase}`);
      if (f.speed) lines.push(`  Speed: ${f.speed} KCAS`);
      if (f.height) lines.push(`  Height: ${f.height} AGL`);
      lines.push(`  Flight Rules: ${f.rules}`);
      lines.push(`  Conditions: ${f.met}`);
    }
    lines.push('');
    lines.push('9. Event Description:');
    lines.push(f.eventDescription || '\u2014');
    if (f.actionsTaken) { lines.push(''); lines.push('10. Actions Taken:'); lines.push(f.actionsTaken); }
    lines.push('');
    lines.push('11. Crew (Confidential):');
    lines.push(`  A. Commander \u2014 Force No: ${f.forceNoA || '\u2014'}, Rank: ${f.rankA || '\u2014'}, Init: ${f.initA || '\u2014'}, Surname: ${f.surnameA || '\u2014'}`);
    lines.push(`  B. Co-pilot/Student \u2014 Force No: ${f.forceNoB || '\u2014'}, Rank: ${f.rankB || '\u2014'}, Init: ${f.initB || '\u2014'}, Surname: ${f.surnameB || '\u2014'}`);
    lines.push(`  Tel No: ${f.tel || 'not provided'}`);
    lines.push(`Injuries: ${f.injuries ? 'Yes \u2014 ' + (f.injuryDetail || 'no detail given') : 'None reported'}`);
    return lines.join('\n');
  }

  function validate() {
    const val = document.getElementById('eventDescription').value.trim();
    const errorEl = document.getElementById('eventError');
    if (!val) {
      errorEl.classList.add('show');
      document.getElementById('eventDescription').focus();
      return false;
    }
    errorEl.classList.remove('show');
    return true;
  }

  document.getElementById('sendBtn').addEventListener('click', () => {
    if (!validate()) return;
    const text = buildReportText();
    const subject = encodeURIComponent(`[MISHAP] ${ddmmyyyy()} \u2014 ${typeSeg.get()} \u2014 ${categorySeg.get()}`);
    const body = encodeURIComponent(text);
    window.location.href = `mailto:${SAFETY_OFFICE_EMAIL}?subject=${subject}&body=${body}`;
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    if (!validate()) return;
    const text = buildReportText();
    const btn = document.getElementById('copyBtn');
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = 'Copied \u2713';
    } catch (err) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); btn.textContent = 'Copied \u2713'; }
      catch (e) { btn.textContent = 'Copy failed'; }
      document.body.removeChild(ta);
    }
    setTimeout(() => { btn.textContent = 'Copy Report Text'; }, 2500);
  });

  function csvField(val) {
    const s = String(val ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function downloadCSV(filename, headers, values) {
    const csv = headers.map(csvField).join(',') + '\n' + values.map(csvField).join(',') + '\n';
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById('downloadBtn').addEventListener('click', () => {
    if (!validate()) return;
    const f = collectFields();
    const headers = ['DTG','Fin Year','TYPE','CATEGORY','DIVISION','TAIL_NO','DD/MM/YYYY','TIME','DAY_TIME',
      'COORDINATES','SORTIE_TYPE','FLIGHT_PHASE','SPEED','HEIGHT','FLIGHT_RULES','FLIGHT_CONDITIONS',
      'EVENT_DESCRIPTION','ACTIONS_TAKEN',
      'FORCE NO_0','RANK_0','INIT_0','NAME_0',
      'FORCE NO_1','RANK_1','INIT_1','NAME_1',
      'TEL_NO','Injuries','Injury Detail'];
    const values = [dtgEl.textContent, finYear(new Date()), typeSeg.get(), categorySeg.get(), divisionEl.value, f.tail,
      ddmmyyyy(), timeOnly(), f.timeOfDay,
      f.coordinates, f.sortieType, f.phase, f.speed, f.height, f.rules, f.met,
      f.eventDescription, f.actionsTaken,
      f.forceNoA, f.rankA, f.initA, f.surnameA,
      f.forceNoB, f.rankB, f.initB, f.surnameB,
      f.tel, f.injuries ? 'Yes' : 'No', f.injuryDetail];
    const safeStamp = dtgEl.textContent.replace(/[^A-Za-z0-9]/g, '');
    downloadCSV(`mishap-${safeStamp}.csv`, headers, values);
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
